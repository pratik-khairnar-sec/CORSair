<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle'%3E%E2%9A%93%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050911;
      color: #00ffcc;
      font-family: 'Segoe UI', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 18px;
    }
    .logo { font-size: 2.4rem; letter-spacing: 4px; font-weight: 700; }
    .sub  { color: #00b4ff; font-size: 0.95rem; opacity: 0.8; }
    .bar  {
      width: 220px; height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      background: linear-gradient(90deg, #00ffcc, #00b4ff);
      animation: load 0.9s ease forwards;
    }
    @keyframes load { from { width: 0% } to { width: 100% } }
    a { color: #00b4ff; font-size: 0.85rem; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="logo">⚓ CORSair</div>
  <div class="sub">Loading Cross-Origin Security Suite…</div>
  <div class="bar"><div class="fill"></div></div>
  <a href="CORSair.html">Click here if not redirected automatically</a>

    window.location.replace('CORSair.html');
  </script>
